<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ReceitasWeb</title>
    <link rel="stylesheet" href="../assets/_common/styles/main.css">
</head>
<body>
    <header class="site-header">
        <nav class="main-nav">
            <a class="brand" href="index.html">ReceitasWeb</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Sobre</a></li>
                <li><a href="contact.html">Contato</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <main class="recipes">
        <section class="login-card">
            <h2>Entrar</h2>
            <p>Faça login para acessar o feed de receitas e comentar nas publicações.</p>
            <form id="login-form">
                <label>
                    E-mail
                    <input type="email" name="email" placeholder="seu@email.com" required>
                </label>
                <label>
                    Senha
                    <input type="password" name="password" placeholder="Senha" required>
                </label>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p>Não tem uma conta? <a href="register.html">Cadastrar</a></p>
        </section>
    </main>

    <footer>
        <p>ReceitasWeb — Login rápido para acessar o feed.</p>
    </footer>
    <script src="../assets/_common/scripts/main.js?v=3"></script>
</body>
</html>
